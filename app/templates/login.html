{% extends "base.html" %}

{% block title %}Login - Papertube{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto; padding: 2.5rem;">
    <div class="text-center" style="margin-bottom: 2rem;">
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--muted-text); font-size: 0.9rem;">Sign in to your Papertube account</p>
    </div>

    {% if error %}
    <div class="alert alert-error" style="margin-bottom: 1.5rem; font-size: 0.85rem;">
        {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success"
        style="margin-bottom: 1.5rem; font-size: 0.85rem; color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 0.75rem; border-radius: 8px;">
        {{ success }}
    </div>
    {% endif %}

    <form method="POST" action="/login{% if next %}?next={{ next }}{% endif %}">
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required
                style="width: 100%; padding: 0.75rem; border-radius: 12px;">
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required
                style="width: 100%; padding: 0.75rem; border-radius: 12px;">
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; font-weight: 700;">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
