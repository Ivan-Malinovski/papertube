<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-slate: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --accent: #ef4444;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            width: 360px;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-slate);
            color: var(--text-main);
            overflow-x: hidden;
            border-radius: var(--radius);
        }

        .header {
            padding: 16px 20px;
            background: linear-gradient(to bottom, #1e293b, #111827);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.025em;
        }

        .main-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .main-link:hover {
            color: var(--primary-hover);
        }

        .content {
            padding: 20px;
        }

        .video-info {
            margin-bottom: 16px;
        }

        .video-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .video-channel {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .summary-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            max-height: 220px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 16px;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            transition: all 0.2s;
            width: fit-content;
        }

        .settings-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--text-muted);
        }

        .view-full-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 16px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            transition: transform 0.2s;
        }

        .view-full-link:hover {
            transform: translateX(2px);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select,
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.85rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius);
            border: none;
            background: linear-gradient(to right, var(--primary), var(--primary-hover));
            color: white;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        button.btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        button.btn-primary:active {
            transform: translateY(0);
        }

        button.btn-primary:disabled {
            background: var(--border);
            transform: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .hidden {
            display: none !important;
        }

        .status {
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 10px;
            text-align: center;
            padding: 6px;
            border-radius: 6px;
        }

        .success {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        #settings-view {
            padding-top: 16px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        #save-settings {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        #save-settings:hover {
            background: var(--border);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="#ef4444">
                <path d="M21 7L9 19L3.5 13.5L4.91 12.09L9 16.17L19.59 5.59L21 7Z" />
            </svg>
            Papertube
        </h1>
        <a href="#" id="open-app" class="main-link">Open App</a>
    </div>

    <div class="content">
        <div id="login-view" class="hidden">
            <div class="text-center" style="margin-bottom: 20px;">
                <h2 style="font-size: 1rem; margin-bottom: 8px;">Login Required</h2>
                <p style="font-size: 0.8rem; color: var(--text-muted);">Please sign in to your accounts</p>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn" class="btn-primary" style="margin-top: 8px;">Sign In</button>
            <div id="login-status" class="status"></div>
        </div>

        <div id="summary-view" class="hidden">
            <div class="video-info">
                <div id="current-title" class="video-title">Loading...</div>
                <div id="current-channel" class="video-channel"></div>
            </div>
            <div id="summary-text" class="summary-box">No summary found for this video.</div>
            <a href="#" id="view-full" class="view-full-link hidden">View Full Summary & Chat →</a>
        </div>

        <div id="action-view">
            <div class="form-group">
                <label for="preset-select">Prompt Preset</label>
                <select id="preset-select">
                    <option value="detailed">Detailed</option>
                    <option value="brief">Brief</option>
                    <option value="bullets">Bullets</option>
                </select>
            </div>
            <button id="summarize-now" class="btn-primary">
                Summarize Now
            </button>
            <div id="status" class="status"></div>
        </div>

        <div id="settings-view" class="hidden">
            <div class="form-group" style="margin-top: 8px;">
                <label for="serverUrl">Server URL</label>
                <input type="text" id="serverUrl" placeholder="http://localhost:8000">
            </div>
            <button id="save-settings" style="width: 100%; padding: 6px; font-size: 0.8rem; cursor: pointer;">Save
                Server URL</button>
        </div>

        <div style="text-align: center; margin-top: 16px;">
            <button id="toggle-settings" class="settings-btn" style="margin: 0 auto;">
                Config & Settings
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
